{% extends "base.html" %}
{% block title %}{{ title }} · SiteExpense{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm p-8">
  <h1 class="text-2xl font-bold mb-6">{{ title }}</h1>
  <form method="post" class="space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<div class="text-red-600 text-sm mt-1">{{ field.errors }}</div>{% endif %}
      </div>
    {% endfor %}
    <button class="rounded-lg bg-slate-950 text-white px-6 py-3">Save</button>
  </form>
</div>
<style>
input, select, textarea { width:100%; border:1px solid #cbd5e1; border-radius:.5rem; padding:.65rem; }
</style>
{% endblock %}
