{% extends "base.html" %}
{% block title %}Login · SiteExpense{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 bg-white p-8 rounded-2xl shadow">
  <h1 class="text-2xl font-bold mb-2">SiteExpense</h1>
  <p class="text-slate-500 mb-6">Site advance & expense management</p>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="w-full rounded-lg bg-slate-950 text-white py-3">Sign in</button>
  </form>
</div>
{% endblock %}
